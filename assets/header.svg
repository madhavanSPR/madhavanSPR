<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-label="Madhavamoorthy checkpoint card">
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#3a3228"/>
    </pattern>
    <clipPath id="card">
      <rect x="20" y="20" width="840" height="220" rx="6"/>
    </clipPath>
  </defs>

  <rect width="880" height="260" fill="#0b0c0a"/>
  <rect x="20" y="20" width="840" height="220" rx="6" fill="#161310" stroke="#3d342b"/>
  <rect x="20" y="20" width="72" height="220" fill="#1e1914" clip-path="url(#card)"/>
  <rect x="20" y="20" width="72" height="220" fill="url(#dots)" opacity="0.55"/>

  <g fill="#0b0c0a">
    <circle cx="56" cy="52" r="7"/>
    <circle cx="56" cy="88" r="7"/>
    <circle cx="56" cy="124" r="7"/>
    <circle cx="56" cy="160" r="7"/>
    <circle cx="56" cy="196" r="7"/>
  </g>

  <text x="38" y="228" transform="rotate(-90 38 228)" fill="#c4a574" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3">CHECKPOINT</text>

  <text x="118" y="64" fill="#8a8074" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2.4">MADHAVANSPR / 2026</text>
  <text x="118" y="108" fill="#efe6d6" font-family="Georgia, 'Times New Roman', serif" font-size="36">Madhavamoorthy</text>
  <text x="118" y="142" fill="#c4a574" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic">Don't be a follower. Be a leader.</text>
  <text x="118" y="186" fill="#b7aea2" font-family="Georgia, 'Times New Roman', serif" font-size="15">I build useful software. Then I send you back to where you stopped.</text>

  <g transform="translate(792 46)">
    <path d="M0 0 h28 v52 l-14 -9 -14 9 z" fill="#c4a574"/>
    <path d="M6 8 h16 v4 H6 z" fill="#161310"/>
  </g>
</svg>
